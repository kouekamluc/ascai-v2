{% load i18n %}
<div id="posts-section">
    <h2 class="text-2xl font-bold mb-6 text-gray-900">{% trans 'Replies' %} <span class="text-lg font-normal text-gray-500">({{ posts|length }})</span></h2>

    <div id="posts-container" class="space-y-6 mb-6">
        {% for post in posts %}
        {% include 'community/partials/post_item.html' with post=post thread=thread %}
        {% empty %}
        <div class="text-center py-12">
            <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
            </svg>
            <p class="text-gray-500 text-lg font-medium">{% trans 'No replies yet.' %}</p>
            <p class="text-gray-400 text-sm mt-2">{% trans 'Be the first to reply to this thread!' %}</p>
        </div>
        {% endfor %}
    </div>
</div>
