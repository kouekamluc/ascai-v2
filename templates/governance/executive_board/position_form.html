{% extends "governance/base.html" %}
{% load i18n %}

{% block page_heading %}{% trans "Assign Executive Position" %}{% endblock %}

{% block content %}
<div class="governance-card max-w-2xl">
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            <datalist id="executive-position-suggestions">
                <option value="president"></option>
                <option value="vice_president"></option>
                <option value="secretary_general"></option>
                <option value="deputy_secretary_general"></option>
                <option value="treasurer"></option>
                <option value="statutory_auditor"></option>
                <option value="communication_culture_manager"></option>
            </datalist>
            {{ form.as_p }}
        </div>
        <div class="mt-6 flex gap-4">
            <button type="submit" class="btn-primary">{% trans "Save" %}</button>
            <a href="{% url 'governance:executive_board_list' %}" class="btn-secondary">{% trans "Cancel" %}</a>
        </div>
    </form>
</div>
{% endblock %}
