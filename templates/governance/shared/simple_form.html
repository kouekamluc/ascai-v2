{% extends "governance/base.html" %}
{% load i18n %}

{% block page_heading %}{% if object %}{% trans "Edit Record" %}{% else %}{% trans "Create Record" %}{% endif %}{% endblock %}

{% block content %}
<div class="governance-card max-w-3xl">
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form.as_p }}
        </div>
        <div class="mt-6 flex flex-wrap gap-4">
            <button type="submit" class="btn-primary">{% trans "Save" %}</button>
            <button type="button" onclick="history.back()" class="btn-secondary">{% trans "Cancel" %}</button>
        </div>
    </form>
</div>
{% endblock %}
