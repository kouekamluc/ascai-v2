{% load i18n static %}
<aside class="hidden lg:flex lg:w-[19rem] lg:flex-col lg:px-4 lg:py-5">
    <div class="dashboard-panel flex h-full min-h-0 flex-col overflow-hidden">
        <div class="border-b border-black/5 px-6 py-6">
            <a href="{% url 'dashboard:home' %}" class="flex items-center gap-3">
                <div class="relative shrink-0">
                    <div class="absolute inset-0 rounded-2xl bg-cameroon-yellow/40 blur-md"></div>
                    <img src="{% static 'images/apple-touch-icon.png' %}" alt="ASCAI Lazio Logo" class="relative h-12 w-12 rounded-2xl bg-white object-contain ring-1 ring-black/5 shadow-lg">
                </div>
                <div class="min-w-0">
                    <p class="text-lg font-extrabold tracking-tight text-ascai-ink">ASCAI Lazio</p>
                    <p class="mt-1 text-xs uppercase tracking-[0.18em] text-cameroon-green">{% trans 'Dashboard' %}</p>
                </div>
            </a>
        </div>
        {% include 'dashboard/partials/sidebar_nav.html' %}
    </div>
</aside>

<div x-show="sidebarOpen" x-cloak class="fixed inset-0 z-50 lg:hidden">
    <div class="absolute inset-0 bg-black/35" @click="sidebarOpen = false"></div>
    <div class="absolute inset-y-0 left-0 flex w-[min(18rem,calc(100vw-1rem))] flex-col p-2 sm:p-4">
        <div class="dashboard-panel flex h-full min-h-0 flex-col overflow-hidden">
            <div class="flex items-center justify-between border-b border-black/5 px-6 py-6">
                <a href="{% url 'dashboard:home' %}" class="flex items-center gap-3">
                    <img src="{% static 'images/apple-touch-icon.png' %}" alt="ASCAI Lazio Logo" class="h-11 w-11 rounded-2xl bg-white object-contain ring-1 ring-black/5 shadow-lg">
                    <div>
                        <p class="text-lg font-extrabold tracking-tight text-ascai-ink">ASCAI Lazio</p>
                        <p class="mt-1 text-xs uppercase tracking-[0.18em] text-cameroon-green">{% trans 'Dashboard' %}</p>
                    </div>
                </a>
                <button aria-label="{% trans 'Close navigation' %}" @click="sidebarOpen = false" class="rounded-2xl p-2 text-gray-500 hover:bg-stone-100 hover:text-gray-700">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            {% include 'dashboard/partials/sidebar_nav.html' %}
        </div>
    </div>
</div>
