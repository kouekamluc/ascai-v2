{% load i18n %}
<div class="{{ wrapper_class|default:'overflow-hidden rounded-[1.5rem] border border-black/5 bg-stone-100' }}">
    {% if document.thumbnail %}
    <img
        src="{{ document.thumbnail.url }}"
        alt="{{ document.title }}"
        class="{{ image_class|default:'h-full w-full object-cover' }}"
    >
    {% else %}
    <div class="{{ fallback_class|default:'flex h-full min-h-[9rem] w-full flex-col items-center justify-center bg-gradient-to-br from-stone-100 via-white to-stone-200 px-4 text-center' }}">
        <svg class="h-10 w-10 text-cameroon-green" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M7 3h7l5 5v11a2 2 0 01-2 2H7a2 2 0 01-2-2V5a2 2 0 012-2zm7 1.5V9h4.5"></path>
        </svg>
        <p class="mt-3 text-xs font-extrabold uppercase tracking-[0.18em] text-cameroon-green">
            {{ document.file_type|default:"file" }}
        </p>
        <p class="mt-2 text-sm font-semibold leading-6 text-gray-600">
            {% trans "Thumbnail unavailable" %}
        </p>
    </div>
    {% endif %}
</div>
